<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hogis Flower Atelier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Noto+Serif+Armenian:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky shop bar, category tabs, product grid; builder is a two-column studio; cart is a side drawer; checkout is a stepped panel */
/* One look, taken from the Hogis logo: burgundy ground, cream type, glacier-blue accents. Same in light and dark mode. */
:root{
  --bg:#5e1a2e;          /* logo burgundy */
  --surface:#6a2236;     /* raised cards and fields */
  --surface-2:#4f1526;   /* image wells */
  --ink:#f7f3ee;         /* logo cream */
  --muted:#dccbcf;
  --line:#874457;
  --accent:#c8d9e3;      /* logo glacier blue */
  --accent-ink:#4a1424;
  --accent-soft:#7a4a60;
  --glacier:#c8d9e3;
  --brand:#4a1424;       /* header band */
  --brand-ink:#f7f3ee;
  --gold:#c8d9e3;
  --stem:#9cbf96;
  --ok:#a8d8b4;
  --warn:#f5c2a8;
  --shadow:0 18px 40px -20px rgba(20,4,10,.7);
  --display:"Cormorant Garamond", "Noto Serif Armenian", Georgia, serif;
  --body:"Cormorant Garamond", "Noto Serif Armenian", Georgia, serif;
  --mono:"Cormorant Garamond", "Noto Serif Armenian", Georgia, serif;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;font-weight:500;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
h1,h2,h3{font-family:var(--display);font-weight:600;overflow-wrap:break-word;text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* header */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:16px;padding-block:14px}
.logo{font-family:var(--display);display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;color:var(--brand-ink);text-align:left}
.logo svg{width:32px;height:42px;flex:none}
.logo .wm{display:flex;flex-direction:column;line-height:1}
.logo .wm b{font-weight:500;font-size:28px;letter-spacing:.32em;margin-right:-.32em}
.logo .wm small{font-size:16px;font-style:italic;color:#c8d9e3;margin-top:4px;letter-spacing:.04em}
.bar-in .spacer{flex:1}
.prefs{display:flex;gap:6px}
.prefs select{width:auto;border:1px solid rgba(247,243,238,.45);border-radius:999px;background:transparent;color:var(--brand-ink);padding:7px 10px;font-size:16px;font-weight:500}
.prefs select option{color:#2e1119;background:#f7f3ee}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cart-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--brand-ink);background:var(--brand-ink);color:#5e1a2e;border-radius:999px;padding:8px 16px;font-weight:700}
.cart-count{background:#5e1a2e;color:#f7f3ee;border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:14px;font-family:var(--mono)}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center;padding-block:40px 24px}
.hero h1{font-size:clamp(36px,5.2vw,60px)}
html[lang="hy"] .hero h1{font-size:clamp(32px,4.4vw,50px)}
html[lang="hy"] .eyebrow,html[lang="hy"] .spec dt{text-transform:none;letter-spacing:.04em}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero p{margin-top:16px;max-width:52ch;color:var(--muted);font-size:18px}
.hero-art svg{width:100%;max-width:420px;height:auto;display:block;margin-left:auto}
.hero-facts{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:22px}
.hero-facts span{font-family:var(--mono);font-size:15px;color:var(--ink)}
.hero-facts span::before{content:"✿ ";color:var(--accent)}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-block:12px 20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 18px;font-weight:500}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{font-family:var(--mono);font-size:14px;opacity:.65;margin-left:6px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.section-head h2{font-size:34px}
.section-head p{color:var(--muted);max-width:56ch}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;padding-bottom:56px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.card .art{background:var(--surface-2);aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;border:0;padding:0;width:100%}
.card .art svg{width:82%;height:auto}
.card .body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3{font-size:22px}
.price{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.card .blurb{color:var(--muted);font-size:16px;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tagline{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:13px;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.hot{background:var(--accent-soft);color:var(--accent)}
.chip.tier{background:var(--glacier);border:1px solid var(--glacier);color:#4a1424}
.occ{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 20px;align-items:center}
.occ .lbl{font-family:var(--mono);font-size:14px;color:var(--muted);margin-right:4px}
.occ button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:16px}
.occ button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.extras{display:flex;flex-direction:column;gap:6px}
.swatch{display:flex;gap:3px;margin-bottom:4px}.swatch i{width:16px;height:16px;border-radius:50%;border:1px solid var(--line)}
.extras .opt label{flex-direction:row;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px}
.extras .opt label small{white-space:nowrap}
header.bar :focus-visible{outline-color:#c8d9e3}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.qty button{border:0;background:transparent;width:34px;height:34px;font-size:18px;line-height:1}
.qty button:hover{background:var(--surface-2)}
.qty output,.qty input{width:34px;text-align:center;font-family:var(--mono);border:0;background:transparent}
.btn{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:8px 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:var(--line);font-weight:500}
.btn.wide{width:100%;padding:12px 18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkish{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:16px}
.card .actions{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* builder */
.studio{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;padding-bottom:56px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.step{display:flex;flex-direction:column;gap:12px;padding-block:18px;border-top:1px solid var(--line)}
.step:first-child{border-top:0;padding-top:0}
.step h3{font-size:22px;display:flex;gap:10px;align-items:baseline}
.step h3 .num{font-family:var(--mono);font-size:15px;color:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt label{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;height:100%}
.opt label b{font-weight:700}
.opt label small{color:var(--muted);font-family:var(--mono);font-size:14px}
.opt input:checked + label{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.stems{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.stem-row .qty button{width:30px;height:30px}
.stem-row .qty output{width:28px}
.stem-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.stem-row svg{width:40px;height:40px;flex:none}
.stem-row .ph-sm{width:48px;height:48px;flex:none;object-fit:contain}
.card .art .ph{width:88%;height:88%;object-fit:contain;display:block}
.modal-card .art .ph{width:100%;max-width:320px;aspect-ratio:1/1;object-fit:contain;display:block}
.ci .thumb .ph{width:88%;height:88%;object-fit:contain}
.stem-row .nm{flex:1;min-width:0}
.stem-row .nm b{display:block;font-weight:500;font-size:17px}
.stem-row .nm small{font-family:var(--mono);color:var(--muted);font-size:14px}
.stem-row.on{border-color:var(--accent)}
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:14px}
.preview .stage{background:var(--surface-2);border-radius:12px;aspect-ratio:1/1;max-width:100%;display:grid;place-items:center}
.preview .stage svg{width:88%;height:auto}
.lines{display:flex;flex-direction:column;gap:4px;font-size:16px}
.lines div{display:flex;justify-content:space-between;gap:12px}
.lines .tot{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-weight:700;font-size:16px}
.hint{font-size:15px;color:var(--muted)}
.err{font-size:15px;color:var(--warn)}
textarea,input[type=text],input[type=tel],input[type=email],input[type=date],select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px}
textarea{resize:vertical;min-height:70px}

/* overlay + drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(15,20,16,.5);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:50;display:flex;flex-direction:column;box-shadow:var(--shadow);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-head h2{font-size:28px}
.x{border:0;background:transparent;font-size:26px;line-height:1;width:40px;height:40px;border-radius:50%}
.x:hover{background:var(--surface-2)}
.drawer-body{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.drawer-foot{border-top:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.ci{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center}
.ci .thumb{background:var(--surface-2);border-radius:10px;aspect-ratio:1/1;display:grid;place-items:center}
.ci .thumb svg{width:88%;height:auto}
.ci .meta{min-width:0}
.ci .meta b{display:block;font-weight:700}
.ci .meta small{display:block;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.ci .side{display:flex;flex-direction:column;align-items:end;gap:6px}
.empty{text-align:center;color:var(--muted);padding:40px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}

.modal{position:fixed;z-index:50;inset:0;display:grid;place-items:center;padding:16px;pointer-events:none}
.modal-card{pointer-events:auto;background:var(--bg);border-radius:16px;max-width:820px;width:100%;max-height:calc(100% - 32px);overflow:auto;display:grid;grid-template-columns:1fr 1fr;box-shadow:var(--shadow)}
.modal-card .art{background:var(--surface-2);display:grid;place-items:center;padding:20px}
.modal-card .art svg{width:100%;max-width:340px;height:auto}
.modal-card .info{padding:24px;display:flex;flex-direction:column;gap:14px;position:relative}
.modal-card .info .x{position:absolute;top:10px;right:10px}
.modal-card h2{font-size:34px;padding-right:40px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:16px}
.spec dt{font-family:var(--mono);font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:2px}
.spec dd{margin:0}
.recipe{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px;font-size:16px}
.recipe li{display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}

/* checkout */
.checkout{max-width:880px;margin:0 auto;padding-bottom:64px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.checkout h2{font-size:38px;margin-bottom:6px}
.fs{border:0;padding:0;margin:0 0 22px;display:flex;flex-direction:column;gap:12px}
.fs legend{font-family:var(--display);font-size:24px;margin-bottom:8px;padding:0}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:16px;font-weight:500}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.summary h3{font-size:22px;margin-bottom:10px}
.done{max-width:620px;margin:0 auto;padding-block:40px 64px;display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center}
.done h2{font-size:44px}
.done .panel{text-align:left;width:100%}
.note-banner{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:16px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:60;font-weight:500}
footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:16px}


/* ---- Hogis atelier styling: thin cream lines, square corners, spaced capitals, centred like the logo ---- */
.btn,.cart-btn,.qty,.chip,.opt label,.occ button,.prefs select,.panel,.card,.modal-card,.preview .stage,.ci .thumb,.note-banner,
textarea,input[type=text],input[type=tel],input[type=email],input[type=date],select{border-radius:2px}
textarea,input[type=text],input[type=tel],input[type=email],input[type=date],select{background:transparent;border-color:var(--line)}
.btn{text-transform:uppercase;letter-spacing:.14em;font-size:15px;font-weight:600;padding:11px 22px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--accent-ink)}
.btn.primary:hover{background:var(--glacier);border-color:var(--glacier);filter:none}
.btn.ghost,.btn:not(.primary){border-color:var(--ink);color:var(--ink);background:transparent}
.cart-btn{text-transform:uppercase;letter-spacing:.12em;font-size:14px}
.eyebrow{letter-spacing:.32em}
.tabs{justify-content:center;gap:6px 30px;padding-block:6px 0}
.tab{border:0;border-radius:0;background:none;padding:12px 2px;letter-spacing:.16em;text-transform:uppercase;font-size:15px;font-weight:600;border-bottom:1px solid transparent;color:var(--muted)}
.tab[aria-selected="true"]{background:none;color:var(--glacier);border-bottom-color:var(--glacier)}
.tab .n{display:none}
.section-head{flex-direction:column;align-items:center;text-align:center;gap:6px;margin-top:10px}
.section-head h2{font-size:42px;font-weight:500;letter-spacing:.03em}
.occ{justify-content:center}
.occ .lbl{display:none}
.occ button{background:transparent;color:var(--ink)}
.occ button[aria-pressed="true"]{background:var(--glacier);border-color:var(--glacier);color:#4a1424}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:13px}
.chip.hot{background:transparent;border-color:var(--glacier);color:var(--glacier)}
.card{background:transparent}
.card h3{font-size:26px;font-weight:500}
.panel{background:transparent}
.opt input:checked + label{background:var(--accent-soft);border-color:var(--glacier);box-shadow:inset 0 0 0 1px var(--glacier)}
.stem-row.on{border-color:var(--glacier)}
.toast{background:var(--glacier);color:#4a1424}
body,.mono,.price,input,select,textarea,output{font-variant-numeric:lining-nums tabular-nums}
.toast{border-radius:2px}
/* dropdown lists: browsers draw these on their own white sheet, so set the colours explicitly */
select option,select optgroup{background:#5e1a2e;color:#f7f3ee}
select option:checked{background:#c8d9e3;color:#4a1424}
html[lang="hy"] .tab,html[lang="hy"] .btn,html[lang="hy"] .chip,html[lang="hy"] .cart-btn{text-transform:none;letter-spacing:.04em}
/* illustrations: cream outlines like the logo's line drawing */
svg[role="img"] :is(circle,ellipse,path,rect){stroke:#f7f3ee;stroke-width:.9;stroke-opacity:.6}
/* hero, centred like the logo */
.hero{grid-template-columns:1fr;justify-items:center;text-align:center;gap:14px;padding-block:48px 28px}
.hero > div:first-child{display:flex;flex-direction:column;align-items:center}
.hero p{margin-left:auto;margin-right:auto}
.hero h1{font-weight:500}
.hero-facts{justify-content:center}
.hero-art{order:-1}
.hero-art svg{width:96px;max-width:96px;margin:0 auto}
/* footer signature */
footer{text-align:center;border-top:1px solid var(--line);padding-block:40px}
.sig{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:18px;color:var(--ink)}
.sig svg{width:40px;height:52px}
.sig b{font-family:var(--display);font-weight:500;font-size:30px;letter-spacing:.32em;margin-right:-.32em}
.sig span{font-family:"Noto Serif Armenian",Georgia,serif;letter-spacing:.3em;color:var(--glacier);font-size:16px}
.sig i{color:var(--glacier);font-size:20px}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .hero-art svg{margin:0 auto;max-width:280px}
  .studio,.checkout{grid-template-columns:1fr}
  .preview,.summary{position:static}
  .modal-card{grid-template-columns:1fr}
  .modal-card .art svg{max-width:220px}
}
@media (max-width:480px){
  .f2{grid-template-columns:1fr}
  .logo{font-size:21px}
  .cart-btn .lbl{display:none}
  .bar-in{gap:8px}
  .prefs select{padding:6px 6px;font-size:15px}
  .logo .wm small{display:none}
  .logo .wm b{font-size:22px;letter-spacing:.22em;margin-right:-.22em}
  .section-head h2{font-size:28px}
}
@media (prefers-reduced-motion: no-preference){
  .card{transition:transform .2s ease, box-shadow .2s ease}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .drawer{animation:slide .25s ease}
  @keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
}
</style>

<header class="bar">

function bloom(x,y,r,f){
  const c=f.color,k=f.center,out=[];
  if(f.kind==="leaf"){for(let i=0;i<5;i++){const a=-90+(i-2)*30;out.push(`<ellipse cx="${x+Math.cos(a*Math.PI/180)*r*.8}" cy="${y+Math.sin(a*Math.PI/180)*r*.8}" rx="${r*.38}" ry="${r*.32}" fill="${c}" stroke="#5f8a78" stroke-width=".8"/>`);}return out.join("");}
  if(f.kind==="gyp"){for(let i=0;i<9;i++){const a=i*40,d=(i%3+1)*r*.28;out.push(`<circle cx="${x+Math.cos(a)*d}" cy="${y+Math.sin(a)*d}" r="${r*.16}" fill="${c}" stroke="#b9c2b5" stroke-width=".6"/>`);}return out.join("");}
  if(f.kind==="cluster"){for(let i=0;i<14;i++){const a=i*2.4,d=Math.sqrt(i/14)*r*.85;out.push(`<circle cx="${x+Math.cos(a)*d}" cy="${y+Math.sin(a)*d}" r="${r*.26}" fill="${i%2?c:k}"/>`);}return out.join("");}
  if(f.kind==="tulip"){return `<path d="M${x-r*.7},${y-r*.1} Q${x-r*.75},${y+r*.85} ${x},${y+r*.8} Q${x+r*.75},${y+r*.85} ${x+r*.7},${y-r*.1} L${x+r*.35},${y-r*.75} L${x},${y-r*.2} L${x-r*.35},${y-r*.75} Z" fill="${c}"/><path d="M${x-r*.2},${y-r*.1} Q${x},${y+r*.6} ${x+r*.2},${y-r*.1}" fill="none" stroke="${k}" stroke-width="${r*.08}"/>`;}
  if(f.kind==="ray"){for(let i=0;i<16;i++){out.push(`<ellipse cx="${x}" cy="${y-r*.68}" rx="${r*.15}" ry="${r*.38}" fill="${c}" transform="rotate(${i*22.5} ${x} ${y})"/>`);}out.push(`<circle cx="${x}" cy="${y}" r="${r*.42}" fill="${k}"/>`);return out.join("");}
  if(f.kind==="lily"){for(let i=0;i<6;i++){out.push(`<path d="M${x},${y} Q${x-r*.32},${y-r*.6} ${x},${y-r} Q${x+r*.32},${y-r*.6} ${x},${y}Z" fill="${c}" stroke="${k}" stroke-width="1" transform="rotate(${i*60} ${x} ${y})"/>`);}out.push(`<circle cx="${x}" cy="${y}" r="${r*.14}" fill="${k}"/>`);return out.join("");}
  if(f.kind==="peony"){for(let i=0;i<10;i++){out.push(`<ellipse cx="${x}" cy="${y-r*.5}" rx="${r*.42}" ry="${r*.5}" fill="${c}" transform="rotate(${i*36} ${x} ${y})" opacity=".95"/>`);}out.push(`<circle cx="${x}" cy="${y}" r="${r*.48}" fill="${k}"/><circle cx="${x}" cy="${y}" r="${r*.3}" fill="${c}"/>`);return out.join("");}

  return out.join("");

function expand(flowers,max){
  const list=[],entries=Object.entries(flowers).filter(([,n])=>n>0),counts=Object.fromEntries(entries);let left=true;
  while(left){left=false;for(const [id] of entries){if(counts[id]>0){list.push(id);counts[id]--;left=true;}}}
  if(list.length>max){const step=list.length/max;return Array.from({length:max},(_,i)=>list[Math.floor(i*step)]);}
  return list;
}
function vesselSVG(v){
  switch(v){
    case "vase":return `<path d="M72,128 Q66,160 78,192 L122,192 Q134,160 128,128 Z" fill="#cfe3e8" fill-opacity=".55" stroke="#7fa2ab" stroke-width="2"/><path d="M80,170 L120,170" stroke="#9fc1c9" stroke-width="2"/>`;
    case "box":return `<rect x="48" y="128" width="104" height="58" rx="6" fill="#2b2b2b"/><ellipse cx="100" cy="128" rx="52" ry="8" fill="#3d3d3d"/><rect x="48" y="150" width="104" height="8" fill="#d8b46a"/>`;
    case "basket":return `<path d="M44,130 L156,130 L142,188 L58,188 Z" fill="#b98b52"/><g stroke="#8a6231" stroke-width="2"><path d="M50,146 L150,146"/><path d="M54,162 L146,162"/><path d="M57,176 L143,176"/></g>`;
    case "bowl":return `<path d="M36,138 Q100,210 164,138 Z" fill="#e9e3d6" stroke="#b7ad99" stroke-width="2"/><path d="M84,175 L116,175 L112,186 L88,186Z" fill="#b7ad99"/>`;
    case "jar":return `<rect x="72" y="134" width="56" height="56" rx="10" fill="#cfe3e8" fill-opacity=".55" stroke="#7fa2ab" stroke-width="2"/><rect x="70" y="128" width="60" height="10" rx="3" fill="#9fc1c9"/>`;
    case "wrap":return `<path d="M50,110 L100,196 L150,110 L132,118 L100,104 L68,118 Z" fill="#c9a77a"/><path d="M68,118 L100,196 L132,118" fill="#b8935f"/><path d="M86,160 Q100,150 114,160" stroke="var(--accent)" stroke-width="4" fill="none"/>`;
  }

}
function art(item,label){
  let s=`<svg viewBox="0 0 200 200" role="img" aria-label="${esc(label||"")}">`;
  if(item.type==="single"){
    const f=F[item.fid];
    if(PHOTO_OK[item.fid])return `<img class="ph" src="${photoSrc(item.fid)}" alt="${esc(label||"")}">`;
    s+=`<path d="M100,95 Q96,150 100,196" stroke="var(--stem)" stroke-width="4" fill="none"/><ellipse cx="84" cy="150" rx="16" ry="7" fill="var(--stem)" transform="rotate(-30 84 150)"/><ellipse cx="116" cy="168" rx="16" ry="7" fill="var(--stem)" transform="rotate(30 116 168)"/>`;
    return s+bloom(100,74,f.kind==="cluster"?44:40,f)+"</svg>";
  }
  const vessel=item.type==="bouquet"?"wrap":item.vessel;
  const blooms=expand(item.flowers,16),n=blooms.length;
  const cx=100,cy=vessel==="bowl"?118:vessel==="vase"?82:vessel==="jar"?100:88;
  const sx=vessel==="bowl"?62:vessel==="jar"?34:52,sy=vessel==="bowl"?26:vessel==="jar"?26:46;
  const r0=vessel==="jar"?15:(n>10?17:21);
  if(vessel==="wrap"||vessel==="vase"||vessel==="jar"){const ey=vessel==="vase"?170:180;for(let i=0;i<Math.min(n,9);i++){s+=`<path d="M${cx+(i-4)*5},${cy} L${cx+(i-4)*2},${ey}" stroke="var(--stem)" stroke-width="2.5"/>`;}}
  if(n) s+=`<ellipse cx="${cx}" cy="${cy+6}" rx="${sx+10}" ry="${sy+8}" fill="var(--stem)" opacity=".35"/>`;
  const order=[...blooms].sort((a,b)=>(F[b].green?1:0)-(F[a].green?1:0));
  const pal=item.pal&&PALETTES[item.pal];
  order.forEach((fid,i)=>{const tt=(i+.5)/n,ang=i*2.39996,d=Math.sqrt(tt);let f=F[fid];if(pal&&!f.green)f={...f,color:pal[i%pal.length],center:pal[(i+2)%pal.length]};const x=cx+Math.cos(ang)*d*sx,y=cy+Math.sin(ang)*d*sy,r=r0*(f.kind==="cluster"?1.25:1);
    if(!pal&&PHOTO_OK[fid]){const w=r*(F[fid].green?3:2.5);s+=`<image href="${photoSrc(fid)}" x="${x-w/2}" y="${y-w/2}" width="${w}" height="${w}" preserveAspectRatio="xMidYMid meet"/>`;}
    else s+=bloom(x,y,r,f);});
  return s+vesselSVG(vessel)+"</svg>";
}

  const flowerCost=Object.entries(b.stems).reduce((a,[id,n])=>a+F[id].price*n,0);
  const vessel=VESSELS.find(v=>v.id===b.vessel),size=SIZES.find(s=>s.id===b.size);
  const base=flowerCost+vessel.price+LABOUR,ex=EXTRAS[b.extra]||0;
  return {stems,flowerCost,vessel,size,base,ex,total:base+ex,enough:stems>=size.min,minOk:base>=MIN_CUSTOM,ok:stems>=size.min&&base>=MIN_CUSTOM};
}
function renderBuilder(el){
  const b=S.builder;
  el.innerHTML=`<div class="studio">
    <div class="panel">
      <div class="step"><h3><span class="num">1</span>${t("step1")}</h3>
        <div class="opts">${VESSELS.map(v=>`<div class="opt"><input type="radio" name="vessel" id="v-${v.id}" value="${v.id}" ${b.vessel===v.id?"checked":""}><label for="v-${v.id}"><b>${t("v_"+v.id)}</b><small>+${money(v.price)} · ${t("vn_"+v.id)}</small></label></div>`).join("")}</div>
      </div>
      <div class="step"><h3><span class="num">2</span>${t("step2")}</h3>
        <div class="opts">${SIZES.map(s=>`<div class="opt"><input type="radio" name="size" id="z-${s.id}" value="${s.id}" ${b.size===s.id?"checked":""}><label for="z-${s.id}"><b>${t("z_"+s.id)}</b><small>${t("zn",{n:s.min})}</small></label></div>`).join("")}</div>
      </div>
      <div class="step"><h3><span class="num">3</span>${t("step3")}</h3>
        <p class="hint">${t("step3hint")}</p>
        <div class="stems">${Object.keys(F).map(id=>{const f=F[id],n=b.stems[id]||0;return `<div class="stem-row ${n?"on":""}" id="sr-${id}">
          ${PHOTO_OK[id]?`<img class="ph-sm" src="${photoSrc(id)}" alt="">`:`<svg viewBox="0 0 60 60" aria-hidden="true">${bloom(30,30,f.kind==="cluster"?24:22,f)}</svg>`}
          <div class="nm"><b>${esc(fName(id))}</b><small>${money(f.price)} ${t("perStemShort")}</small></div>
          ${qtyHTML(id,n,"data-stem")}</div>`}).join("")}</div>
      </div>
      <div class="step"><h3><span class="num">4</span>${t("step4")}</h3>
        <div class="field"><label for="b-mood">${t("mood")}</label>
          <select id="b-mood">${t("moods").map((o,i)=>`<option value="${i}" ${b.mood===i?"selected":""}>${o}</option>`).join("")}</select></div>
        <div class="field"><label for="b-msg">${t("msg")} <span class="hint">${t("optional")}</span></label>
          <textarea id="b-msg" maxlength="200" placeholder="${esc(t("msgPh"))}">${esc(b.message)}</textarea></div>
        <div id="b-extras">${extrasHTML("bextra",b.extra,"custom")}</div>
      </div>
    </div>
    <aside class="panel preview" aria-label="${t("yourArr")}">
      <p class="eyebrow">${t("yourArr")}</p><p class="hint">${t("minCustom",{p:money(MIN_CUSTOM)})}</p>
      <div class="stage" id="b-stage"></div>
      <div class="lines" id="b-lines"></div>
      <p class="err" id="b-err" hidden></p>
      <div class="row" style="justify-content:space-between">${qtyHTML("custom",S.qty.custom||1)}<button class="btn primary" id="b-add">${t("add")}</button></div>
    </aside>
  </div>`;
  updateBuilder();
}
function updateBuilder(){
  const b=S.builder,st=bState(),stage=$("#b-stage");if(!stage)return;
  stage.innerHTML=art({type:"arrangement",vessel:b.vessel,flowers:b.stems},t("yourArr"));
  $("#b-lines").innerHTML=`
    <div><span>${t("stemsN",{n:st.stems})}</span><span class="mono">${money(st.flowerCost)}</span></div>
    <div><span>${t("v_"+st.vessel.id)}</span><span class="mono">${money(st.vessel.price)}</span></div>
    <div><span>${t("arranging")}</span><span class="mono">${money(LABOUR)}</span></div>
    ${st.ex?`<div><span>${t("ex_"+b.extra)}</span><span class="mono">${money(st.ex)}</span></div>`:""}
    <div class="tot"><span>${t("each")}</span><span class="mono">${money(st.total)}</span></div>`;
  const err=$("#b-err");
  if(!st.enough){err.hidden=false;err.textContent=t("needMore",{size:t("z_"+st.size.id),min:st.size.min,k:st.size.min-st.stems});}
  else if(!st.minOk){err.hidden=false;err.textContent=t("belowMin",{p:money(MIN_CUSTOM)});}else err.hidden=true;
  $("#b-add").disabled=!st.ok;
  Object.keys(F).forEach(id=>{const r=$("#sr-"+id);if(r)r.classList.toggle("on",(b.stems[id]||0)>0);});
}
function addCustom(){
  const b=S.builder,st=bState();if(!st.ok)return;
  const entry={key:"c-"+Date.now(),custom:{vessel:b.vessel,size:b.size,stems:{...b.stems},mood:b.mood,message:b.message,extra:b.extra},price:st.total,qty:S.qty.custom||1};
  addToCart(entry,lineName(entry));
}

/* ---------- cart ---------- */
function thumb(c){if(c.personal)return art(persItem(c.personal),lineName(c));return c.custom?art({type:"arrangement",vessel:c.custom.vessel,flowers:c.custom.stems},lineName(c)):art(byId(c.id),lineName(c));}
function openCart(){
  const items=S.cart;
  layer.innerHTML=`<div class="scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="c-title">
    <div class="drawer-head"><h2 id="c-title">${t("yourBasket")}</h2><button class="x" data-close aria-label="${t("close")}">×</button></div>
    <div class="drawer-body">${items.length?items.map(c=>`<div class="ci">
        <div class="thumb">${thumb(c)}</div>
        <div class="meta"><b>${esc(lineName(c))}</b><small>${money(linePrice(c))} ${t("each2")}</small>${(c.custom||c.personal)?`<small>${esc(lineNote(c))}</small>`:""}</div>
        <div class="side"><span class="price">${money(linePrice(c)*c.qty)}</span>${qtyHTML(c.key,c.qty,"data-cq")}<button class="linkish" data-rm="${c.key}">${t("remove")}</button></div>
      </div>`).join(""):`<div class="empty"><p>${t("empty")}</p><button class="btn" data-close>${t("browse")}</button></div>`}</div>
    ${items.length?`<div class="drawer-foot"><div class="lines"><div class="tot"><span>${t("subtotal")}</span><span class="mono">${money(cartTotal())}</span></div></div>${CUR!=="AMD"?`<p class="hint">${t("fxNote",{cur:CUR})}</p>`:""}<p class="hint">${t("nextHint")}</p><button class="btn primary wide" id="to-checkout">${t("chooseDelivery")}</button></div>`:""}
  </aside>`;
  layer.querySelector(".x").focus();
}
function closeLayer(){layer.innerHTML="";}

/* ---------- checkout ---------- */
const SLOTS=[{id:"9-12",label:"09:00 – 12:00",start:9},{id:"12-15",label:"12:00 – 15:00",start:12},{id:"15-18",label:"15:00 – 18:00",start:15},{id:"18-21",label:"18:00 – 21:00",start:18,fee:1500}];
const ZONES=[{id:"z1",fee:1500},{id:"z2",fee:2500},{id:"z3",fee:5000},{id:"pickup",fee:0}];
const CHANNELS=[{id:"email",label:{en:"Email",ru:"Email",hy:"Էլ. փոստ"}},{id:"sms",label:{en:"SMS",ru:"SMS",hy:"SMS"}},{id:"whatsapp",label:{en:"WhatsApp"}},{id:"telegram",label:{en:"Telegram"}},{id:"viber",label:{en:"Viber"}}];
const chLabel=ch=>ch.label[LANG]||ch.label.en;
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const nowH=()=>{const d=new Date();return d.getHours()+d.getMinutes()/60;};
function minDate(){return iso(new Date());}
function maxDate(){const d=new Date();d.setDate(d.getDate()+60);return iso(d);}
function defaultDate(){const d=new Date();d.setDate(d.getDate()+1);return iso(d);}
const CO={date:"",slot:"",zone:"z1",name:"",phone:"",street:"",city:"",notes:"",buyer:"",email:"",bphone:"",pay:"whatsapp",card:""};
const fmtDate=(isoStr,long)=>(LANG==="hy"&&!HY_OK)?(d=>`${d.getDate()} ${HY_MG[d.getMonth()]}, ${HY_D[d.getDay()]}`)(new Date(isoStr+"T12:00")):new Date(isoStr+"T12:00").toLocaleDateString(LOCALE[LANG],long?{weekday:"long",day:"numeric",month:"long"}:{weekday:"short",day:"numeric",month:"short"});

function renderCheckout(){
  if(!S.cart.length){S.view="shop";return render();}
  if(!CO.date)CO.date=defaultDate();
  if(!CO.city)CO.city=t("cityDefault");
  app.innerHTML=`<div class="wrap" style="padding-top:28px">
    <button class="linkish" id="back-shop">${t("back")}</button>
    <form class="checkout" id="co-form" novalidate style="margin-top:16px">
      <div>
        <h2>${t("delivery")}</h2>
        <p class="hint" style="margin-bottom:22px">${t("deliveryHint")}</p>
        <fieldset class="fs"><legend>${t("when")}</legend>
          <div class="field"><label for="co-date">${t("date")}</label><input type="date" id="co-date" lang="${LANG}" min="${minDate()}" max="${maxDate()}" value="${CO.date}" required>
          <span class="hint">${t("sameDay")}</span></div>
          <div class="field"><span style="font-size:14px;font-weight:500" id="slot-lbl">${t("window")}</span>
            <div class="slots" role="radiogroup" aria-labelledby="slot-lbl" id="slots"></div></div>
          <p class="err" id="e-when" hidden></p>
        </fieldset>
        <fieldset class="fs"><legend>${t("where")}</legend>
          <div class="field"><label for="co-zone">${t("area")}</label><select id="co-zone">${ZONES.map(z=>`<option value="${z.id}" ${CO.zone===z.id?"selected":""}>${t("zone_"+z.id)} · ${z.fee?money(z.fee):t("free")}</option>`).join("")}</select></div>
          <div id="addr">
            <div class="f2"><div class="field"><label for="co-name">${t("rName")}</label><input type="text" id="co-name" autocomplete="name" value="${esc(CO.name)}"></div>
            <div class="field"><label for="co-phone">${t("rPhone")}</label><input type="tel" id="co-phone" autocomplete="tel" placeholder="+374" value="${esc(CO.phone)}"></div></div>
            <div class="f2" style="margin-top:12px"><div class="field"><label for="co-street">${t("street")}</label><input type="text" id="co-street" autocomplete="street-address" placeholder="${esc(t("streetPh"))}" value="${esc(CO.street)}"></div>
            <div class="field"><label for="co-city">${t("city")}</label><input type="text" id="co-city" autocomplete="address-level2" value="${esc(CO.city)}"></div></div>
            <div class="field" style="margin-top:12px"><label for="co-notes">${t("notes")} <span class="hint">${t("optional")}</span></label><textarea id="co-notes" placeholder="${esc(t("notesPh"))}">${esc(CO.notes)}</textarea></div>
          </div>
          <p class="note-banner" id="pickup-note" hidden>${t("pickupNote")}</p>
          <p class="err" id="e-where" hidden></p>
        </fieldset>
        <fieldset class="fs"><legend>${t("cardWord")}</legend>
          <div class="field"><label for="co-card">${t("msg")} <span class="hint">${t("optional")}</span></label>
          <textarea id="co-card" maxlength="300" placeholder="${esc(t("msgPh"))}">${esc(CO.card)}</textarea><span class="hint">${t("cardHand")}</span></div>
        </fieldset>
        <fieldset class="fs"><legend>${t("you")}</legend>
          <div class="f2"><div class="field"><label for="co-buyer">${t("yName")}</label><input type="text" id="co-buyer" value="${esc(CO.buyer)}"></div>
          <div class="field"><label for="co-bphone">${t("yPhone")}</label><input type="tel" id="co-bphone" autocomplete="tel" placeholder="+374" value="${esc(CO.bphone)}"></div></div>
          <div class="field"><label for="co-email">${t("yEmail")}</label><input type="email" id="co-email" autocomplete="email" value="${esc(CO.email)}"></div>
          <p class="err" id="e-you" hidden></p>
        </fieldset>
        <fieldset class="fs"><legend>${t("payment")}</legend>
          <p>${t("payText")}</p>
          <div class="field"><label for="co-pay">${t("sendBy")}</label><select id="co-pay">${CHANNELS.map(ch=>`<option value="${ch.id}" ${CO.pay===ch.id?"selected":""}>${chLabel(ch)}</option>`).join("")}</select></div>
        </fieldset>
      </div>
      <aside class="panel summary">
        <h3>${t("summary")}</h3>
        <div class="lines" id="co-lines"></div>
        <button class="btn primary wide" type="submit" style="margin-top:16px">${t("place")}</button>
      </aside>
    </form></div>`;
  renderSlots();updateCheckout();
}
function renderSlots(){
  const today=iso(new Date())===CO.date,h=nowH();
  $("#slots").innerHTML=SLOTS.map(s=>{const past=today&&h>=s.start+3;if(past&&CO.slot===s.id)CO.slot="";
    return `<div class="opt"><input type="radio" name="slot" id="sl-${s.id}" value="${s.id}" ${CO.slot===s.id?"checked":""} ${past?"disabled":""}><label for="sl-${s.id}" ${past?'style="opacity:.45"':""}><b class="mono">${s.label}</b><small>${past?t("gone"):s.fee?t("evening",{p:money(s.fee)}):t("included")}</small></label></div>`}).join("");
}
function fees(){const z=ZONES.find(z=>z.id===CO.zone),s=SLOTS.find(s=>s.id===CO.slot);return {zone:z,slotFee:(s&&s.fee&&z.id!=="pickup")?s.fee:0};}
function updateCheckout(){
  const {zone,slotFee}=fees(),tot=cartTotal()+zone.fee+slotFee,pick=zone.id==="pickup";
  $("#addr").hidden=pick;$("#pickup-note").hidden=!pick;
  const slot=SLOTS.find(s=>s.id===CO.slot);
  $("#co-lines").innerHTML=S.cart.map(c=>`<div><span>${c.qty} × ${esc(lineName(c))}</span><span class="mono">${money(c.qty*linePrice(c))}</span></div>`).join("")+
    `<div style="margin-top:6px"><span>${pick?t("collection"):t("delivery")} · ${t("zone_"+zone.id)}</span><span class="mono">${zone.fee?money(zone.fee):t("free")}</span></div>`+
    (slotFee?`<div><span>${t("eveningLine")}</span><span class="mono">${money(slotFee)}</span></div>`:"")+
    `<div class="tot"><span>${t("total")}</span><span class="mono">${money(tot)}</span></div>`+
    (CUR!=="AMD"?`<div><span></span><span class="mono hint">= ${money(tot,"AMD")}</span></div><p class="hint">${t("fxNote",{cur:CUR})}</p>`:"")+
    `<p class="hint" style="margin-top:8px">${CO.date?fmtDate(CO.date):"—"}${slot?" · "+slot.label:" · "+t("pickWindow")}</p>
     <p class="hint">${t("paySent")}</p>`;
  return tot;
}
function readCheckout(){
  CO.date=$("#co-date").value;CO.zone=$("#co-zone").value;
  const sel=document.querySelector('input[name="slot"]:checked');CO.slot=sel?sel.value:"";
  ["name","phone","street","city","notes","buyer","email","bphone","pay","card"].forEach(k=>{const el=$("#co-"+k);if(el)CO[k]=el.value.trim();});
}
function validate(){
  let ok=true;const show=(id,msg)=>{const e=$(id);e.hidden=!msg;e.textContent=msg||"";if(msg)ok=false;};
  show("#e-when",!CO.date?t("eDate"):CO.date<minDate()?t("ePast"):!CO.slot?t("eSlot"):"");
  if(CO.zone==="pickup")show("#e-where","");
  else{const miss=[!CO.name&&t("rName"),!CO.phone&&t("rPhone"),!CO.street&&t("street"),!CO.city&&t("city")].filter(Boolean);
    show("#e-where",miss.length?t("eAddr",{list:miss.join(", ")}):"");}
  show("#e-you",!CO.buyer?t("eName"):!CO.bphone?t("ePhone"):(CO.pay==="email"||CO.email)&&!/^\S+@\S+\.\S+$/.test(CO.email)?t("eEmail"):"");
  return ok;
}
function placeOrder(){
  readCheckout();if(!validate()){const e=document.querySelector(".err:not([hidden])");e&&e.scrollIntoView({behavior:"smooth",block:"center"});return;}
  const total=updateCheckout();
  S.order={no:"HG-"+String(Math.floor(1000+Math.random()*9000)),items:S.cart.map(c=>({...c})),total,co:{...CO}};
  S.cart=[];saveCart();updateBadge();S.view="done";render();window.scrollTo(0,0);
}
function renderDone(){
  const o=S.order,slot=SLOTS.find(s=>s.id===o.co.slot),ch=CHANNELS.find(c=>c.id===o.co.pay),pick=o.co.zone==="pickup";
  app.innerHTML=`<div class="wrap"><div class="done">
    <svg viewBox="0 0 200 200" width="140" aria-hidden="true">${bloom(100,100,70,F.peony)}</svg>
    <p class="eyebrow">${t("order")} ${o.no}</p>
    <h2>${t("thanks",{name:esc(o.co.buyer.split(" ")[0])})}</h2>
    <p>${t("doneText",{how:chLabel(ch),to:esc(o.co.pay==="email"?o.co.email:o.co.bphone)})}</p>
    <p class="hint">${t("protoNote")}</p>
    <div class="panel"><dl class="spec">
      <dt>${t("when")}</dt><dd>${fmtDate(o.co.date,true)}, ${slot.label}</dd>
      <dt>${pick?t("dCollect"):t("dDeliverTo")}</dt><dd>${pick?t("shopName"):`${esc(o.co.name)}, ${esc(o.co.phone)}<br>${esc(o.co.street)}, ${esc(o.co.city)}`}</dd>
      ${o.co.card?`<dt>${t("cardWord")}</dt><dd>“${esc(o.co.card)}”</dd>`:""}
      <dt>${t("items")}</dt><dd>${o.items.map(i=>`${i.qty} × ${esc(lineName(i))}`).join("<br>")}</dd>
      <dt>${t("total")}</dt><dd class="mono">${money(o.total)}${CUR!=="AMD"?` (${money(o.total,"AMD")})`:""}</dd>
    </dl></div>
    <button class="btn" id="back-shop">${t("backShop")}</button>
  </div></div>`;
}

function render(){
  renderChrome();
  if(S.view==="checkout")renderCheckout();else if(S.view==="done")renderDone();else renderShop();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-close]");if(!b)return;
  const d=b.dataset;
  if(d.occ){S.occ=d.occ;renderGrid($("#tab-body"),TABS.find(x=>x.id===S.tab));return;}
  if(d.tab){S.tab=d.tab;renderShop();$("#tab-"+S.tab).focus();return;}
  if(d.detail){openDetail(d.detail);return;}
  if(d.q){const id=d.q;S.qty[id]=Math.max(1,Math.min(99,(S.qty[id]||1)+ +d.d));document.querySelectorAll("#q-"+CSS.escape(id)).forEach(o=>o.textContent=S.qty[id]);return;}
  if(d.stem){const id=d.stem,st=S.builder.stems;st[id]=Math.max(0,Math.min(50,(st[id]||0)+ +d.d));$("#q-"+CSS.escape(id)).textContent=st[id];updateBuilder();return;}
  if(d.cq){const c=S.cart.find(c=>c.key===d.cq);c.qty=Math.max(1,Math.min(99,c.qty+ +d.d));saveCart();updateBadge();openCart();if(S.view==="checkout")updateCheckout();return;}
  if(d.rm){S.cart=S.cart.filter(c=>c.key!==d.rm);saveCart();updateBadge();openCart();if(S.view==="checkout")renderCheckout();return;}
  if(d.add){const p=byId(d.add),ex=p.type==="single"?"none":(S.extra[p.id]||"none");const entry={key:p.id+"|"+ex,id:p.id,extra:ex,qty:S.qty[p.id]||1};addToCart(entry,lineName(entry));if(b.hasAttribute("data-close-after"))closeLayer();return;}
  if(b.id==="b-add"){addCustom();return;}
  if(b.id==="pn-add"){addPersonal();return;}
  if(b.id==="cart-btn"){openCart();return;}
  if(b.id==="to-checkout"){closeLayer();S.view="checkout";render();window.scrollTo(0,0);return;}
  if(b.id==="back-shop"||b.id==="home-btn"){closeLayer();S.view="shop";render();window.scrollTo(0,0);return;}
  if(b.hasAttribute("data-close")){closeLayer();return;}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="sel-lang"||el.id==="sel-cur"){
    if(S.view==="checkout")readCheckout();
    const cityWasDefault=[I18N.en.cityDefault,I18N.ru.cityDefault,I18N.hy.cityDefault].includes(CO.city);
    if(el.id==="sel-lang"){LANG=el.value;try{localStorage.setItem("snb-lang",LANG);}catch(x){}if(cityWasDefault)CO.city=t("cityDefault");}
    else{CUR=el.value;try{localStorage.setItem("snb-cur",CUR);}catch(x){}}
    const wasOpen=layer.querySelector(".drawer");closeLayer();render();if(wasOpen)openCart();return;
  }
  if(el.name&&el.name.startsWith("x-")){S.extra[el.dataset.pid]=el.value;const box=el.closest(".extras");box.outerHTML=extrasHTML(el.name,el.value,el.dataset.pid);const f=document.getElementById(el.name+"-"+el.value);f&&f.focus();return;}
  if(el.id==="pn-day"||el.id==="pn-month"){S.pers[el.id==="pn-day"?"day":"month"]=el.value;updatePersonal();return;}
  if(el.id==="pn-sign"){S.pers.sign=el.value;S.pers.day="";S.pers.month="";$("#pn-day").value="";$("#pn-month").value="";updatePersonal();return;}
  if(el.name==="pnpal"){S.pers.pal=el.value;updatePersonal();return;}
  if(el.name==="pnsize"){S.pers.size=el.value;updatePersonal();return;}
  if(el.name==="bextra"){S.builder.extra=el.value;$("#b-extras").innerHTML=extrasHTML("bextra",el.value,"custom");const f=document.getElementById("bextra-"+el.value);f&&f.focus();updateBuilder();return;}
  if(el.name==="vessel"){S.builder.vessel=el.value;updateBuilder();}
  if(el.name==="size"){S.builder.size=el.value;updateBuilder();}
  if(el.id==="b-mood"){S.builder.mood=+el.value;}
  if(S.view==="checkout"&&el.closest("#co-form")){readCheckout();if(el.id==="co-date")renderSlots();updateCheckout();}
});
document.addEventListener("input",e=>{if(e.target.id==="b-msg")S.builder.message=e.target.value;if(e.target.id==="pn-name"){S.pers.name=e.target.value;$("#pn-title").textContent=S.pers.name?t("pnFor",{name:S.pers.name}):t("pnForNone");}});
document.addEventListener("submit",e=>{if(e.target.id==="co-form"){e.preventDefault();placeOrder();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&layer.innerHTML)closeLayer();});

render();
</script>

</body></html>
